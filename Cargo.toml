[workspace]
resolver = "2"
members = [
    "crates/katu-core",
    "crates/katu-llm",
    "crates/katu-agent",
    "crates/katu-provider-http",
    "crates/katu-provider-openai",
    "crates/katu-tool",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# 内部 crate
katu-core = { path = "crates/katu-core" }
katu-llm = { path = "crates/katu-llm" }
katu-agent = { path = "crates/katu-agent" }
katu-provider-http = { path = "crates/katu-provider-http" }
katu-provider-openai = { path = "crates/katu-provider-openai" }
katu-tool = { path = "crates/katu-tool" }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误
thiserror = "2"

# ID
uuid = { version = "1", features = ["v7", "serde"] }

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 异步
tokio = { version = "1", features = ["full"] }
futures = "0.3"
futures-core = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
async-trait = "0.1"

# HTTP
reqwest = { version = "0.13", features = ["json", "stream"] }
eventsource-stream = "0.2"

# 日志
tracing = "0.1"

# 随机
rand = "0.9"

# 有序 HashMap
indexmap = { version = "2", features = ["serde"] }

# 进程管理
tokio-util = { version = "0.7", features = ["rt"] }
libc = "0.2"

# 测试
tokio-test = "0.4"
